name: Release

# v0.2.0 のようなタグをプッシュすると、署名した APK を作って GitHub Releases に載せる。
# 署名鍵はリポジトリに置かず、次のシークレットで渡す（作り方は README の「リリース」）:
#   PONO_KEYSTORE_BASE64   キーストア（.jks）を base64 にしたもの
#   PONO_KEYSTORE_PASSWORD キーストアの合言葉
#   PONO_KEY_ALIAS         鍵の別名
#   PONO_KEY_PASSWORD      鍵の合言葉
# Actions のページから手で動かすと（Run workflow）、署名した APK を作って確かめるだけで、リリースには載せない。
# シークレットを登録したあと、鍵が正しく使えるかを試すのに使う。APK は実行結果の Artifacts から取れる。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6

      # Rust の SAORI（shiori-yaya/src/main/rust）。runner に入っている rustup に Android の target を足す
      - name: Add Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Prepare signing key
        env:
          PONO_KEYSTORE_BASE64: ${{ secrets.PONO_KEYSTORE_BASE64 }}
          PONO_KEYSTORE_PASSWORD: ${{ secrets.PONO_KEYSTORE_PASSWORD }}
          PONO_KEY_ALIAS: ${{ secrets.PONO_KEY_ALIAS }}
          PONO_KEY_PASSWORD: ${{ secrets.PONO_KEY_PASSWORD }}
        run: |
          for name in PONO_KEYSTORE_BASE64 PONO_KEYSTORE_PASSWORD PONO_KEY_ALIAS PONO_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::シークレット $name がありません（README の「リリース」を参照）"
              exit 1
            fi
          done
          echo "$PONO_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          PONO_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          PONO_KEYSTORE_PASSWORD: ${{ secrets.PONO_KEYSTORE_PASSWORD }}
          PONO_KEY_ALIAS: ${{ secrets.PONO_KEY_ALIAS }}
          PONO_KEY_PASSWORD: ${{ secrets.PONO_KEY_PASSWORD }}
        run: |
          # タグ v0.2.0 → versionName 0.2.0。versionCode はこのワークフローの通し番号（必ず増える）
          # 手で動かしたとき（タグではない）は build.gradle.kts の既定の番号のまま
          version=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=(-PponoVersionName="${GITHUB_REF_NAME#v}" -PponoVersionCode="${{ github.run_number }}")
          fi
          ./gradlew :baseware:test :app:assembleRelease --stacktrace "${version[@]}"

      - name: Verify signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::署名済みの APK ができていません"
            exit 1
          fi
          build_tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$build_tools/apksigner" verify --print-certs "$apk"
          mkdir -p dist
          # 手で動かしたときの名前はブランチ名から（feature/x の / は - に）
          cp "$apk" "dist/pono-droid-${GITHUB_REF_NAME//\//-}.apk"

      # 手で動かしたときは、リリースに載せずに Artifacts に置く
      - name: Upload signed APK
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: pono-droid-signed-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # v0.2.0-beta.1 のように - を含むタグはプレリリースにする
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "dist/pono-droid-${GITHUB_REF_NAME}.apk" \
            --title "pono-droid ${GITHUB_REF_NAME}" \
            --generate-notes \
            $prerelease

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
