name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

# 同じブランチ（PR）に続けてプッシュしたら、古い実行は止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # YAYA とその依存ライブラリ（parson / tinyxml2 / sqlite / gumbo / uka_regexp）はサブモジュール
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # baseware は JDK 17 のツールチェーンでビルドする。Gradle 自体は最後に書いた 21 で動かす
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6

      # Rust の SAORI（shiori-yaya/src/main/rust）。runner に入っている rustup に Android の target を足す
      - name: Add Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      # Android SDK は runner に入っている。compileSdk 37 のプラットフォームと NDK / CMake は
      # 足りなければ Android Gradle Plugin がビルド中にインストールする
      - name: Build debug and preview APKs and run unit tests
        run: ./gradlew :baseware:test :shiori-yaya:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug :app:assemblePreview :shiori-yaya:assembleDebugAndroidTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: pono-droid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload preview APK
        uses: actions/upload-artifact@v7
        with:
          name: pono-droid-preview-apk
          path: app/build/outputs/apk/preview/*.apk
          if-no-files-found: error

      - name: Upload native test APK
        uses: actions/upload-artifact@v7
        with:
          name: shiori-native-tests-apk
          path: shiori-yaya/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error

      # 落ちたテストを注釈にして出す（ログを開かなくても、どのテストがなぜ落ちたか分かるように）
      - name: Show failed tests
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as E
          paths = glob.glob('baseware/build/test-results/test/*.xml') + glob.glob('app/build/test-results/testDebugUnitTest/*.xml') + glob.glob('shiori-yaya/build/test-results/testDebugUnitTest/*.xml')
          for p in paths:
              for tc in E.parse(p).getroot().iter('testcase'):
                  for x in tc:
                      if x.tag in ('failure', 'error'):
                          msg = (x.get('message') or '').replace('\n', ' ')[:300]
                          where = [l.strip() for l in (x.text or '').splitlines() if 'net.pono' in l][:3]
                          print('::error title=%s.%s::%s | %s' % (tc.get('classname').split('.')[-1], tc.get('name'), msg, ' / '.join(where)))
          EOF

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: baseware-test-reports
          path: baseware/build/reports/tests/
          if-no-files-found: ignore

  shiori-native-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: shiori-native-tests-apk
          path: native-test
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run nashi and legacy Kawari JNI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -t native-test/shiori-yaya-debug-androidTest.apk
            adb shell am instrument -w -r -e class net.pono.shiori.yaya.NashiNativeTest,net.pono.shiori.yaya.Kawari7NativeTest net.pono.shiori.yaya.test/androidx.test.runner.AndroidJUnitRunner | tee shiori-results.txt
            python3 -c "import pathlib, re; text = pathlib.Path('shiori-results.txt').read_text(); assert re.search(r'OK \(11 tests\)', text), text"
      - name: Upload native test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shiori-test-results-api-${{ matrix.api }}
          path: shiori-results.txt
          if-no-files-found: ignore
