# minato（湊）の Android 用のビルド（:shiori-yaya:prepareRustShioriSources が元のソースと並べて写す）。
# 依存は元の Cargo.toml と同じ。Windows の winapi は src/main/rust/pono-winapi（同じ名前の関数を libc で作ったもの）に替える。
# 構文チェッカー（minato_check・minato-checker-gui）は作らない。版は Cargo.lock で決める（元の Cargo.lock から始めた）
[package]
name = "minato"
version = "0.3.0"
edition = "2021"
publish = false

[dependencies]
chumsky = { version = "0.10", default-features = false }
chrono = "0.4"
toml = "0.8"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
winapi = { path = "../pono-winapi" }
once_cell = "1"
encoding_rs = "0.8"

[features]
# 元の構文チェッカー用（ここでは使わない）
cli = []

[lib]
name = "minato"
path = "src/lib.rs"
crate-type = ["staticlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# 元と同じく unwind（lib.rs の catch_unwind が働くように）
panic = "unwind"

[workspace]
