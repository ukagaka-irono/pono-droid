# saori-qrcode の Android 用のビルド（:shiori-yaya:prepareRustSaoriSources が元のソースと並べて写す）。
# 依存は元の Cargo.toml と同じ。Windows だけの winapi は使わない（lib.rs と chars.rs は src/main/rust のものに替える）。
# 版は Cargo.lock で決める
[package]
name = "saori-qrcode"
version = "0.1.1"
edition = "2021"
publish = false

[dependencies]
qrcode = "0.14.0"
image = "0.25.1"

[lib]
name = "saori_qrcode"
path = "src/lib.rs"
crate-type = ["staticlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[workspace]
