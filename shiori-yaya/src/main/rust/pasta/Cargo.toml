# pasta の Android 用のビルド（:shiori-yaya:prepareRustShioriSources が元の crates/ と並べて写す）。
# 元のワークスペースの Cargo.toml の代わりで、SHIORI に要る 4 つ（pasta_core・pasta_dsl・pasta_lua・pasta_shiori）だけを入れる。
# 依存は元と同じ。ただし Lua は LuaJIT（luajit52）の代わりに PUC Lua 5.4（lua54）にする（Android 向けに作れるように。
# LuaJIT の FFI はサンドボックスを素通りできるので、どのみち使わせない）。pasta は辞書を日本語の名前の Lua に変えるので、
# Lua は LUA_UCID（名前に UTF-8 を許す。CMakeLists.txt の CFLAGS）で作る。版は Cargo.lock で決める（元の Cargo.lock から始めた）
[workspace]
members = ["crates/pasta_core", "crates/pasta_dsl", "crates/pasta_lua", "crates/pasta_shiori"]
resolver = "2"

[workspace.package]
version = "0.4.3"
edition = "2024"
authors = ["Dot-Station Master <dot.station@gmail.com>"]
license = "MIT"
repository = "https://github.com/ekicyou/pasta"
homepage = "https://github.com/ekicyou/pasta"
documentation = "https://github.com/ekicyou/pasta"
keywords = ["shiori", "ghost", "ukagaka"]

[workspace.dependencies]
pest = "2.8.6"
pest_derive = { version = "2.8.6", features = ["grammar-extras"] }
thiserror = "2"
fast_radix_trie = "1.2.0"
rand = "0.10"
tracing = "0.1"
tempfile = "3"
insta = { version = "1.47.2", features = ["glob"] }
tracing-test = { version = "0.2", features = ["no-env-filter"] }
mlua = { version = "0.12.2", features = ["lua54", "vendored", "serialize"] }
regex = "1.12.3"
toml = "1.1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
flate2 = "1.1.9"
budouy = { version = "0.2.2", features = ["vendored-models"] }
unicode-width = "0.2.2"
unicode-segmentation = "1.13.3"
socket2 = "0.6"
flume = "0.12"
arc-swap = "1.9"
shiori4_abi = "0.1"
embed-resource = "3"
md5 = "0.8"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
time = { version = "0.3", features = ["local-offset", "parsing"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_Globalization"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
pasta_core = { path = "crates/pasta_core", version = "0.4.3" }
pasta_dsl = { path = "crates/pasta_dsl", version = "0.4.3" }
pasta_lua = { path = "crates/pasta_lua", version = "0.4.3" }
pasta_shiori = { path = "crates/pasta_shiori", version = "0.4.3" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# 元は abort。SHIORI の .so の中で止まるとそのプロセスごと落ちるのは同じなので、元に合わせる
panic = "abort"
