# saori-pie-chart の Android 用のビルド（:shiori-yaya:prepareRustSaoriSources が元のソースと並べて写す）。
# 依存は元の Cargo.toml と同じ。Windows だけの winapi は使わない（lib.rs と chars.rs は src/main/rust のものに替える）。
# 版は Cargo.lock で決める
[package]
name = "saori-pie-chart"
version = "1.0.4"
edition = "2021"
publish = false

[dependencies]
svg-pie-chart = { git = "https://github.com/tukinami/svg-pie-chart.git" }
resvg = { version = "0.49.0", default-features = false, features = [ "text", "system-fonts", "memmap-fonts" ] }
png = "0.18.1"

[lib]
name = "piechart"
path = "src/lib.rs"
crate-type = ["staticlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1

[workspace]
